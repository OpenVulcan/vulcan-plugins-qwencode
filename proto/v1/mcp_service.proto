syntax = "proto3";

package vulcan.mcp.v1;

// LuaSkillsService exposes stable LuaSkills management methods plus one dynamic tool-call entry.
// LuaSkillsService 暴露稳定的 LuaSkills 管理方法，以及一个动态工具调用入口。
service LuaSkillsService {
  // ListTools returns only LuaSkills dynamic runtime entries exposed as callable tools.
  // ListTools 仅返回 LuaSkills 动态运行时入口暴露出的可调用工具。
  rpc ListTools(LuaSkillListToolsRequest) returns (LuaSkillListToolsResponse);

  // GetTool returns one LuaSkills dynamic runtime entry by canonical tool name.
  // GetTool 按标准工具名称返回一个 LuaSkills 动态运行时入口。
  rpc GetTool(LuaSkillGetToolRequest) returns (LuaSkillGetToolResponse);

  // CallTool invokes one LuaSkills dynamic tool.
  // CallTool 调用一个 LuaSkills 动态工具。
  rpc CallTool(LuaSkillCallToolRequest) returns (LuaSkillCallToolResponse);

  // ListInstalledSkills renders the USER-layer managed LuaSkills inventory.
  // ListInstalledSkills 渲染 USER 层受管 LuaSkills 清单。
  rpc ListInstalledSkills(LuaSkillListInstalledSkillsRequest) returns (LuaSkillTextResponse);

  // InstallSkill installs one USER-layer managed LuaSkill from an approved source.
  // InstallSkill 从已批准来源安装一个 USER 层受管 LuaSkill。
  rpc InstallSkill(LuaSkillInstallRequest) returns (LuaSkillTextResponse);

  // UpdateSkill updates one USER-layer managed LuaSkill by skill id.
  // UpdateSkill 按技能标识更新一个 USER 层受管 LuaSkill。
  rpc UpdateSkill(LuaSkillUpdateRequest) returns (LuaSkillTextResponse);

  // UninstallSkill uninstalls one USER-layer LuaSkill while retaining databases.
  // UninstallSkill 卸载一个 USER 层 LuaSkill，并保留数据库。
  rpc UninstallSkill(LuaSkillUninstallRequest) returns (LuaSkillTextResponse);

  // ReloadRuntimeConfigs reloads hot-reloadable runtime configs used by LuaSkills calls.
  // ReloadRuntimeConfigs 重载 LuaSkills 调用使用的可热重载运行时配置。
  rpc ReloadRuntimeConfigs(LuaSkillReloadRuntimeConfigsRequest) returns (LuaSkillTextResponse);
}

// HostAdapterService exposes host adapter relay planning helpers over gRPC.
// HostAdapterService 通过 gRPC 暴露宿主适配器中转规划辅助能力。
service HostAdapterService {
  // GetHostAdapterProfile returns one normalized host adapter descriptor and capability profile.
  // GetHostAdapterProfile 返回一个归一化宿主适配器描述与能力画像。
  rpc GetHostAdapterProfile(HostAdapterProfileRequest) returns (HostAdapterProfileResponse);

  // BuildHostAdapterRuntime normalizes session/workmem context for one host adapter call.
  // BuildHostAdapterRuntime 为单次宿主适配器调用归一化 session/workmem 上下文。
  rpc BuildHostAdapterRuntime(HostAdapterRuntimeRequest) returns (HostAdapterRuntimeResponse);

  // DiffToolRegistry compares two host-visible tool registry snapshots.
  // DiffToolRegistry 对比两份宿主可见 tool 注册表快照。
  rpc DiffToolRegistry(HostAdapterDiffToolRegistryRequest) returns (HostAdapterDiffToolRegistryResponse);

  // BuildToolRefreshNotice turns tool registry changes into model/user-facing refresh guidance.
  // BuildToolRefreshNotice 将 tool 注册表变化转换为面向模型和用户的刷新提示。
  rpc BuildToolRefreshNotice(HostAdapterToolRefreshNoticeRequest) returns (HostAdapterToolRefreshNoticeResponse);

  // GetVmmStatus reports whether the VMM backend is enabled for this host runtime.
  // GetVmmStatus 返回当前宿主运行时是否启用了 VMM 后端。
  rpc GetVmmStatus(HostAdapterVmmStatusRequest) returns (HostAdapterVmmStatusResponse);

  // ListVmmMemoryTools returns host-facing descriptors for the stable VMM memory tools.
  // ListVmmMemoryTools 返回稳定 VMM 记忆工具的宿主可见描述。
  rpc ListVmmMemoryTools(HostAdapterListVmmMemoryToolsRequest) returns (HostAdapterListVmmMemoryToolsResponse);

  // ListVmmProfileTools returns host-facing descriptors for optional VMM profile-adjust tools.
  // ListVmmProfileTools 返回可选 VMM 画像调整工具的宿主可见描述。
  rpc ListVmmProfileTools(HostAdapterListVmmProfileToolsRequest) returns (HostAdapterListVmmProfileToolsResponse);
}

// LuaSkillClientContext carries the trusted gRPC client identity used for exact budget resolution.
// LuaSkillClientContext 承载受信任的 gRPC 客户端身份，用于精确预算解析。
message LuaSkillClientContext {
  string client_name = 1;
  string client_version = 2;
  string request_id = 3;
}

// LuaSkillProjectionContext declares whether the caller can hide and host-manage LUASKILL_SID.
// LuaSkillProjectionContext 声明调用方是否可以隐藏并由宿主托管 LUASKILL_SID。
message LuaSkillProjectionContext {
  bool supports_managed_luaskill_sid = 1;
  string session_id = 2;
}

// LuaSkillToolDescriptor describes one callable LuaSkills dynamic runtime entry.
// LuaSkillToolDescriptor 描述一个可调用的 LuaSkills 动态运行时入口。
message LuaSkillToolDescriptor {
  string name = 1;
  string description = 2;
  string input_schema_json = 3;
  string annotations_json = 4;
  string skill_id = 5;
  string entry_name = 6;
  string root_name = 7;
  string skill_dir = 8;
}

// LuaSkillTextResponse carries a rendered text result for stable LuaSkills RPCs.
// LuaSkillTextResponse 承载稳定 LuaSkills RPC 的文本渲染结果。
message LuaSkillTextResponse {
  string text = 1;
  bool is_error = 2;
  string message = 3;
}

// LuaSkillListToolsRequest asks for dynamic LuaSkills tool descriptors.
// LuaSkillListToolsRequest 请求动态 LuaSkills 工具描述。
message LuaSkillListToolsRequest {
  LuaSkillClientContext context = 1;
  LuaSkillProjectionContext projection = 2;
}

// LuaSkillListToolsResponse returns dynamic LuaSkills tool descriptors.
// LuaSkillListToolsResponse 返回动态 LuaSkills 工具描述。
message LuaSkillListToolsResponse {
  repeated LuaSkillToolDescriptor tools = 1;
}

// LuaSkillGetToolRequest selects one dynamic LuaSkills tool by canonical name.
// LuaSkillGetToolRequest 按标准名称选择一个动态 LuaSkills 工具。
message LuaSkillGetToolRequest {
  LuaSkillClientContext context = 1;
  string tool_name = 2;
  LuaSkillProjectionContext projection = 3;
}

// LuaSkillGetToolResponse returns one dynamic LuaSkills tool descriptor.
// LuaSkillGetToolResponse 返回一个动态 LuaSkills 工具描述。
message LuaSkillGetToolResponse {
  LuaSkillToolDescriptor tool = 1;
}

// LuaSkillCallToolRequest invokes one dynamic LuaSkills tool with JSON arguments.
// LuaSkillCallToolRequest 使用 JSON 参数调用一个动态 LuaSkills 工具。
message LuaSkillCallToolRequest {
  LuaSkillClientContext context = 1;
  string tool_name = 2;
  string arguments_json = 3;
  LuaSkillProjectionContext projection = 4;
}

// LuaSkillCallToolResponse returns the rendered MCP-compatible tool result.
// LuaSkillCallToolResponse 返回渲染后的 MCP 兼容工具结果。
message LuaSkillCallToolResponse {
  string result_json = 1;
  string text = 2;
  bool is_error = 3;
  string message = 4;
}

// LuaSkillListInstalledSkillsRequest asks for the USER-layer managed inventory.
// LuaSkillListInstalledSkillsRequest 请求 USER 层受管清单。
message LuaSkillListInstalledSkillsRequest {
  LuaSkillClientContext context = 1;
}

// LuaSkillInstallRequest installs one USER-layer managed skill.
// LuaSkillInstallRequest 安装一个 USER 层受管技能。
message LuaSkillInstallRequest {
  LuaSkillClientContext context = 1;
  string source = 2;
  string source_type = 3;
}

// LuaSkillUpdateRequest updates one USER-layer managed skill.
// LuaSkillUpdateRequest 更新一个 USER 层受管技能。
message LuaSkillUpdateRequest {
  LuaSkillClientContext context = 1;
  string skill_id = 2;
}

// LuaSkillUninstallRequest uninstalls one USER-layer skill.
// LuaSkillUninstallRequest 卸载一个 USER 层技能。
message LuaSkillUninstallRequest {
  LuaSkillClientContext context = 1;
  string skill_id = 2;
}

// LuaSkillReloadRuntimeConfigsRequest reloads hot-reloadable runtime config files.
// LuaSkillReloadRuntimeConfigsRequest 重载可热重载运行时配置文件。
message LuaSkillReloadRuntimeConfigsRequest {
  LuaSkillClientContext context = 1;
}

// HostAdapterClientContext carries trusted client identity for adapter relay diagnostics.
// HostAdapterClientContext 承载适配器中转诊断使用的受信任客户端身份。
message HostAdapterClientContext {
  string client_name = 1;
  string client_version = 2;
  string request_id = 3;
}

message HostAdapterProfileRequest {
  HostAdapterClientContext context = 1;
  string host_kind = 2;
}

message HostAdapterProfileResponse {
  string adapter_json = 1;
  string profile_json = 2;
  string host_kind = 3;
  string display_name = 4;
  string refresh_mode = 5;
  string identity_mode = 6;
  bool is_error = 7;
  string message = 8;
  bool vmm_enabled = 9;
  string vmm_status = 10;
}

message HostAdapterRuntimeRequest {
  HostAdapterClientContext context = 1;
  string host_kind = 2;
  string adapter_host_kind = 3;
  string session_id = 4;
  string workmem_id = 5;
  string turn_id = 6;
  string workspace = 7;
  string user_message = 8;
  string conversation_id = 9;
  string root_session_id = 10;
}

message HostAdapterRuntimeResponse {
  string runtime_json = 1;
  string host_kind = 2;
  string session_id = 3;
  string workmem_id = 4;
  string workmem_source = 5;
  bool identity_ready = 6;
  repeated string degraded_reasons = 7;
  bool is_error = 8;
  string message = 9;
  bool vmm_enabled = 10;
  string vmm_status = 11;
}

message HostAdapterDiffToolRegistryRequest {
  HostAdapterClientContext context = 1;
  string previous_snapshot_json = 2;
  string next_snapshot_json = 3;
  string refresh_mode = 4;
  bool dynamic_tool_refresh_supported = 5;
  bool has_dynamic_tool_refresh_supported = 6;
  bool host_restart_required = 7;
}

message HostAdapterDiffToolRegistryResponse {
  string diff_json = 1;
  repeated string changed_tool_ids = 2;
  repeated string added_tool_ids = 3;
  repeated string removed_tool_ids = 4;
  repeated string updated_tool_ids = 5;
  bool restart_required = 6;
  string summary = 7;
  bool is_error = 8;
  string message = 9;
}

message HostAdapterToolRefreshNoticeRequest {
  HostAdapterClientContext context = 1;
  string host_kind = 2;
  string previous_snapshot_json = 3;
  string next_snapshot_json = 4;
}

message HostAdapterToolRefreshNoticeResponse {
  string notice_json = 1;
  bool changed = 2;
  string refresh_mode = 3;
  string severity = 4;
  bool restart_required = 5;
  repeated string changed_tool_ids = 6;
  string model_message = 7;
  string user_message = 8;
  bool is_error = 9;
  string message = 10;
}

message HostAdapterVmmStatusRequest {
  HostAdapterClientContext context = 1;
}

message HostAdapterVmmStatusResponse {
  bool vmm_enabled = 1;
  string vmm_status = 2;
  bool is_error = 3;
  string message = 4;
}

// HostAdapterToolDescriptor describes one stable host-visible tool.
// HostAdapterToolDescriptor 描述一个稳定的宿主可见工具。
message HostAdapterToolDescriptor {
  string name = 1;
  string description = 2;
  string input_schema_json = 3;
  string annotations_json = 4;
  string source = 5;
}

// HostAdapterListVmmMemoryToolsRequest asks for VMM memory tool metadata.
// HostAdapterListVmmMemoryToolsRequest 请求 VMM 记忆工具元信息。
message HostAdapterListVmmMemoryToolsRequest {
  HostAdapterClientContext context = 1;
}

// HostAdapterListVmmMemoryToolsResponse returns VMM memory tool descriptors.
// HostAdapterListVmmMemoryToolsResponse 返回 VMM 记忆工具描述。
message HostAdapterListVmmMemoryToolsResponse {
  repeated HostAdapterToolDescriptor tools = 1;
  bool is_error = 2;
  string message = 3;
  bool vmm_enabled = 4;
  string vmm_status = 5;
}

// HostAdapterListVmmProfileToolsRequest asks for VMM profile-adjust tool metadata.
// HostAdapterListVmmProfileToolsRequest 请求 VMM 画像调整工具元信息。
message HostAdapterListVmmProfileToolsRequest {
  HostAdapterClientContext context = 1;
}

// HostAdapterListVmmProfileToolsResponse returns VMM profile-adjust tool descriptors.
// HostAdapterListVmmProfileToolsResponse 返回 VMM 画像调整工具描述。
message HostAdapterListVmmProfileToolsResponse {
  repeated HostAdapterToolDescriptor tools = 1;
  bool is_error = 2;
  string message = 3;
  bool vmm_enabled = 4;
  string vmm_status = 5;
}
